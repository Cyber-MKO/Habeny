name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"  # weekly, so newly published advisories fail the audit job
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      # The full rule set in ruff.toml; a finding fails the build
      - run: ruff check .
      # tests/stubs/lxc.py stands in for python-lxc, so no LXC is needed (the
      # integration workflow covers real LXC). The coverage floor stops it sliding back.
      - run: python -m pytest -q -W error::DeprecationWarning --cov=app --cov-report=term --cov-fail-under=76
        env:
          HABENY_LXC_BACKEND: direct
          PYTHONPATH: tests/stubs

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  package:
    name: Package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: shellcheck -S warning start.sh deploy/*.sh tests/integration/*.sh
      - run: npm ci && npm run build
        working-directory: frontend
      # The release tarball and .deb (no offline wheels, to keep it quick)
      - run: deploy/build-release.sh dist
        env:
          HABENY_WHEEL_PYTHONS: ""
      - name: Check the package
        run: |
          deb="$(ls dist/habeny_*_all.deb)"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | grep >/dev/null './opt/habeny/static/index.html'
          dpkg-deb --contents "$deb" | grep >/dev/null './lib/systemd/system/habeny.service'
          tar -tzf dist/habeny-*.tar.gz | grep >/dev/null 'static/.habeny-build'

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --audit-level=moderate
        working-directory: frontend
