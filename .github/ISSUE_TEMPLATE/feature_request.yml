name: Feature request
description: Suggest something Habeny should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How you'd like it to work. Screens, API calls or examples help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do now instead
  - type: input
    id: scale
    attributes:
      label: Scale
      description: How many servers, containers or users this is for, if it matters.
