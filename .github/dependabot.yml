# Weekly pull requests for outdated or vulnerable dependencies. Security fixes are
# also raised as soon as an advisory is published (enable "Dependabot security
# updates" under Settings -> Code security).
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      # Packages that must move together (peer dependencies), including major versions;
      # split up they fail to install
      react:
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
      vite:
        patterns: [vite, "@vitejs/*"]
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
